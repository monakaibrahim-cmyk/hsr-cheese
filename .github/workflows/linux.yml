name: Linux Build

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  build:
    name: Build on Linux (MinGW)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake mingw-w64

      - name: Configure CMake
        run: cmake -S . -B build-linux -DCMAKE_TOOLCHAIN_FILE=mingw64.toolchain.cmake -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-linux --parallel $(nproc)

      - name: Run tests (optional)
        run: ctest --test-dir build-linux --output-on-failure
