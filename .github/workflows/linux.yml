name: Linux Build

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  build:
    name: Build on Linux (MinGW)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake mingw-w64

      - name: Fix MSVC-specific syntax for MinGW
        run: |
          sed -i 's/UnityEngine::Vector2/Vector2/g' include/global/unitysdk/UnityEngine/Vector2.h
          sed -i 's/UnityEngine::Vector3/Vector3/g' include/global/unitysdk/UnityEngine/Vector3.h
          sed -i 's/::Vector3/Vector3/g' include/global/unitysdk/UnityEngine/Vector3.h
          sed -i 's/::Vector2/Vector2/g' include/global/unitysdk/UnityEngine/Vector2.h

      - name: Configure CMake
        run: cmake -S . -B build-linux -DCMAKE_TOOLCHAIN_FILE=mingw64.toolchain.cmake -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-linux --parallel $(nproc)
